<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Critical: prevent flash of white -->
    <style>
      :root { --bg: #0b0f19; --text: #f8fafc; }
      [data-theme='light'] { --bg: #f8fafc; --text: #0f172a; }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
      #root { min-height: 100dvh; }
    </style>

    <!-- Apply saved theme before any paint -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('fq_settings') || '{}');
          if (s.theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
          else document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>

    <!-- Preconnect to font servers -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical font -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" />

    <!-- Icons & PWA -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='none' stroke='%236366f1' stroke-width='7'/><ellipse cx='50' cy='50' rx='18' ry='42' fill='none' stroke='%236366f1' stroke-width='7'/><line x1='8' y1='50' x2='92' y2='50' stroke='%236366f1' stroke-width='7'/></svg>" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="theme-color" content="#0b0f19" />
    <link rel="manifest" href="./manifest.json" />

    <!-- SEO -->
    <title>FlagQuest — Learn World Flags &amp; Capitals</title>
    <meta name="description" content="Master the flags of the world — one answer at a time. 6 game modes, 190+ countries, a global XP leaderboard, and zero signup. Free forever." />
    <meta name="keywords" content="flags quiz, world flags, learn flags, capitals game, geography quiz, country flags, FlagQuest" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://flagquest-steel.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flagquest-steel.vercel.app/" />
    <meta property="og:site_name" content="FlagQuest" />
    <meta property="og:title" content="FlagQuest — Master the world's flags" />
    <meta property="og:description" content="6 game modes, 190+ countries, and a global XP World Cup. No signup, free forever." />
    <meta property="og:image" content="https://flagquest-steel.vercel.app/icon.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FlagQuest — Master the world's flags" />
    <meta name="twitter:description" content="6 game modes, 190+ countries, and a global XP World Cup. No signup, free forever." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
